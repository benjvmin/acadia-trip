<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  }

  input {
    width: 100%; margin-top: 22px; padding: 13px 14px;
    font: 16px ui-monospace, "SF Mono", Menlo, monospace;
    border: 1px solid #4b6b58; border-radius: 8px;
    background: #f4efe4; color: #26302b; text-align: center;
  }
  input:focus { outline: 2px solid #d98a4e; outline-offset: 1px; }
  button {
    width: 100%; margin-top: 12px; padding: 13px;
    font: 600 14px ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .12em; text-transform: uppercase;
    border: 0; border-radius: 8px; cursor: pointer;
    background: #d98a4e; color: #26302b;
  }
  .err { min-height: 20px; margin-top: 12px; font-size: 13.5px; color: #f0b48c; }
</style>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(ENC.iv) }, key, b(ENC.data));
  return new TextDecoder().decode(plain);
}
function show(html) {
  document.open();
  document.write(html);
  document.close();
}
const f = document.getElementById('f');
f.addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const btn = f.querySelector('button');
  btn.disabled = true; btn.textContent = 'Unlocking…';
  try {
    const html = await unlock(pw);
    try { sessionStorage.setItem('acadia-pw', pw); } catch (_) {}
    show(html);
  } catch (_) {
    btn.disabled = false; btn.textContent = 'Unlock';
    document.getElementById('err').textContent = 'Wrong password — try again.';
  }
});
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem('acadia-pw'); } catch (_) {}
  if (!saved) return;
  try { show(await unlock(saved)); } catch (_) {}
})();
